<!DOCTYPE html>
<html lang="en">

<head>

  <link
    rel="icon"
    href="assets/logo-icon.png"
  />

  <title>
    ShareGate — Dashboard
  </title>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#050816"
  />

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="dashboard.css"
  />

</head>

<body>

  <!-- BACKGROUND GLOWS -->
  <div class="bgGlows" aria-hidden="true">
    <div class="glow glowOne"></div>
    <div class="glow glowTwo"></div>
    <div class="gridFade"></div>
  </div>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <a href="landing.html" class="logo">

        <img
          src="assets/logo-icon.png"
          alt="ShareGate logo"
        />

        <span>
          ShareGate
        </span>

      </a>

      <div class="menu">

        <div class="menuItem active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          Dashboard
        </div>

        <a
          href="index.html"
          class="menuLink"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
          Upload
        </a>

      </div>

      <div class="sidebarFoot">
        <div class="netPill">
          <span class="netDot"></span>
          Base Sepolia
        </div>
      </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

      <!-- TOPBAR -->
      <div class="topbar">

        <div>

          <h1>
            My Files
          </h1>

          <p>
            Encrypted decentralized storage
          </p>

        </div>

        <button id="connectBtn">
          Connect Wallet
        </button>

      </div>

      <!-- GRID -->
      <div id="filesGrid"></div>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

  <script src="dashboard.js"></script>

</body>

</html>
